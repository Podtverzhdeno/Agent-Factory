[project]
name = "agent-factory-quality-engine"
version = "0.1.0"
requires-python = ">=3.12"
description = "Component-only deterministic evaluator and cost-quality benchmark"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1"]
http = ["httpx>=0.27,<1"]
sql = ["sqlalchemy>=2.0,<3"]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["../../tests/quality-engine"]
