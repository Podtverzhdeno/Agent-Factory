# Railway-compatible process networking; service authorization remains fail-closed.
server.address=0.0.0.0
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.main.banner-mode=off

# Correlate framework logs with our server-generated UUID; never use incoming request IDs.
logging.pattern.level=%5p [request_id:%X{request_id:-none}]
