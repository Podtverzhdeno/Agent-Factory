# DRAFT ONLY. Must be reviewed/copied by the CI owner into .github/workflows/.
# This file is intentionally inert inside the agent-owned module directory.
name: Tool Registry — Java 21 build, HTTP and security gates

on:
  pull_request:
    paths:
      - services/tool-mcp-registry/**
      - tests/tool-registry/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/tool-mcp-registry/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core, negative security, property, concurrency and API contract tests
        run: bash tests/tool-registry/run.sh
      - name: Maven integration and Spring MVC/JWT tests — mandatory
        run: mvn -B -ntp -Dstyle.color=never -f services/tool-mcp-registry/pom.xml clean verify
