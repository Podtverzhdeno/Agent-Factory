name: Studio C0 reproducibility
on:
  push:
    branches: [integration/studio-c0-prep-20261028]
  pull_request:
    paths:
      - 'apps/studio/**'
      - '.github/workflows/studio-c0.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproducible install
        working-directory: apps/studio
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production dependency vulnerability audit
        working-directory: apps/studio
        run: npm audit --omit=dev --audit-level=high
      - name: Lockfile must remain committed and unchanged
        run: git diff --exit-code -- apps/studio/package-lock.json
      - name: TypeScript
        working-directory: apps/studio
        run: npm run typecheck
      - name: ESLint
        working-directory: apps/studio
        run: npm run lint
      - name: Next.js build (no live upstream)
        working-directory: apps/studio
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Python task-lease state machine and PR-scope tests
        run: python -m unittest discover -s tests/studio-coordination -v
