name: SDD validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-sdd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check specification traceability
        run: |
          python scripts/check_sdd.py
          python scripts/check_a2a_sdd.py
          python scripts/check_twin_agent_sdd.py
          python scripts/check_parallel_agents.py
      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@latest
      - name: Validate change strictly
        run: |
          openspec validate bootstrap-factory-mvp --strict
          openspec validate a2a-bilateral-evaluation --strict
          openspec validate twin-agent-harness --strict
